org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

kotlin.code.style=official

# What a consuming repository sets. The stand sets all of it, including the parts with defaults, so
# that a rename of a property name fails here rather than in a repository six months from now.
version=0.1.0
sborka.group=io.github.youndie.stand
sborka.repository=youndie/sborka
sborka.description=A stand that applies every sborka convention. Not published.
sborka.inceptionYear=2026
sborka.jvmToolchain=21
sborka.jvmFloor=17
sborka.junitVersion=6.1.3
sborka.mutationPackage=stand

# WHICH MODULES THE PERF-LINT JUDGES. Nothing static knows what is hot, so a repository says; absent,
# every perf finding is a report and no build can be broken by taking a new sborka. The stand names
# one module so that the scope is exercised rather than only documented — and `:jvm-lib` is the one
# with JVM output, which is the only kind of output this reader can see.
sborka.perflint.hot=:jvm-lib

# The stand's own `.editorconfig` is sborka's, symlinked; the check has nothing to opt out of.

# THE CATALOG IS OFF IN THE ORDINARY RUN, AND ON IN CI. Not a preference — an ordering fact: a
# settings plugin resolves its version catalog before any task in the same invocation has run, so this
# build cannot read a catalog the build beside it is about to publish. CI publishes `:catalog` to a
# directory and then runs the stand a second time with `-Psborka.catalog=on` and
# `-Psborka.catalogRepository` pointing at it, which is the only ordering in which the coordinate is
# resolved for real. See .github/workflows/check.yaml.
sborka.catalog=off

# Maven Central, so that the shape a release needs -- a javadoc jar beside the sources jar -- is
# produced here rather than discovered at the portal by the first repository to try.
sborka.central=true
