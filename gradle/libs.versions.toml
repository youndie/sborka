# The catalog sborka BUILDS WITH. What it PUBLISHES is `catalog/sborka.versions.toml`, and the two
# are deliberately separate files: this one names a ktlint plugin sborka runs on itself, that one
# names the versions nineteen repositories agree on, and merging them would make every bump of the
# former a release of the latter.

[versions]
kotlin = "2.4.10"
ktlintPlugin = "14.2.0"

# The FORMATTER, and the default `sborka.lint` hands to every consumer. Generated into `:core` so the
# number lives here and nowhere else — the same file sborka is linted from.
ktlintTool = "1.8.0"
junit = "6.1.3"

# A binding for the tests only. ktlint's engine logs through slf4j, and without a binding on the
# test runtime every call into it dies in a static initialiser — 36 tests failing on
# `NoClassDefFoundError: org/slf4j/LoggerFactory`, which names the class and not the missing artefact.
slf4j = "2.0.18"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintPlugin" }

# THE RULE API kapkan IS WRITTEN AGAINST, at the same version as the tool that loads it. `compileOnly`
# in `:kapkan`: ktlint puts these on the worker classpath itself, and a ruleset jar carrying a second
# copy of them is a second copy of `RuleId` — which is not the `RuleId` the engine matches against.
ktlint-rule-engine-core = { module = "com.pinterest.ktlint:ktlint-rule-engine-core", version.ref = "ktlintTool" }
ktlint-cli-ruleset-core = { module = "com.pinterest.ktlint:ktlint-cli-ruleset-core", version.ref = "ktlintTool" }
# The engine and the standard rules, for the tests only: a rule is tested by running ktlint over a
# snippet, and one test runs the standard ruleset beside kapkan to pin how the two read one `@Suppress`.
ktlint-rule-engine = { module = "com.pinterest.ktlint:ktlint-rule-engine", version.ref = "ktlintTool" }
ktlint-ruleset-standard = { module = "com.pinterest.ktlint:ktlint-ruleset-standard", version.ref = "ktlintTool" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
