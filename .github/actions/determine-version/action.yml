name: Determine version
description: >
  The head of the version from gradle.properties, with the run number on the tail. Copied word for
  word into three repositories before this existed. Refuses a head ending in -SNAPSHOT, which would
  publish as X.Y.Z-SNAPSHOT.N, and warns about a head the repository has already tagged vX.Y.Z,
  whose X.Y.Z.N would sort above that release.

inputs:
  key:
    description: The gradle.properties key holding the head of the version.
    required: false
    default: version
  file:
    description: Where to read it from.
    required: false
    default: gradle.properties

outputs:
  version:
    description: The full version, head plus run number.
    value: ${{ steps.read.outputs.version }}
  tagged:
    description: >
      The tag that already names the head (`v<head>`), empty when there is none. Not empty means the
      version above sorts above a release and reads as a rebuild of it.
    value: ${{ steps.read.outputs.tagged }}

runs:
  using: composite
  steps:
    - id: read
      shell: bash
      env:
        KEY: ${{ inputs.key }}
        FILE: ${{ inputs.file }}
        RUN: ${{ github.run_number }}
      run: |
        set -euo pipefail
        # The run number goes on the tail: two publishes in a row must not produce the same
        # coordinate, or a consumer cannot tell them apart and keeps the cached older one.
        #
        # `grep -E "^key="` and not `grep key`: a substring match picks up a commented-out line or a
        # neighbouring key, and the version it then reports is a version nobody set.
        #
        # `|| true` because the message below is the point. Under `pipefail` a grep that matches
        # nothing fails the assignment, `set -e` ends the step there, and the step went red with no
        # line saying which key or which file. A file that is not there is said separately.
        if [ ! -f "$FILE" ]; then
          echo "::error::${FILE} does not exist, so there is no ${KEY} to read" >&2
          exit 1
        fi
        head="$(grep -E "^${KEY}=" "$FILE" | head -1 | cut -d= -f2- | tr -d '[:space:]' || true)"
        if [ -z "$head" ]; then
          echo "::error::${KEY} is not set in ${FILE}" >&2
          exit 1
        fi

        # A -SNAPSHOT HEAD IS REFUSED, not passed through. The run number goes on whatever the head
        # is, so `0.1.0-SNAPSHOT` becomes `0.1.0-SNAPSHOT.1`. That is neither of the two shapes the
        # portfolio publishes (`X.Y.Z.N` for a snapshot, `X.Y.Z` for a release), and it is not a
        # Maven snapshot either: a repository treats a version as one only when it ENDS in
        # -SNAPSHOT. So it goes out as a fixed version whose name says snapshot. kontainer's first
        # publish did exactly that (kontainer e18d6bb), on a green run (#119).
        #
        # The head itself is legitimate elsewhere. It is sborka.publish's fallback for a build that
        # is never given -PVERSION. It is wrong only here, where a number is put on its tail.
        # Compared without regard to case: a lower-case head is the same mistake.
        case "$(printf '%s' "$head" | tr '[:lower:]' '[:upper:]')" in
          *-SNAPSHOT)
            echo "::error::${KEY}=${head} in ${FILE} ends in -SNAPSHOT, and this action puts the run" \
                 "number on the tail: it would publish ${head}.${RUN}, which is neither a numbered" \
                 "snapshot nor a release. Set ${KEY}=${head%-*} (the plain X.Y.Z of the next" \
                 "release), or pass the whole version instead (the version input of" \
                 "publish-wip.yaml)." >&2
            exit 1 ;;
        esac

        # A HEAD THAT IS ALREADY TAGGED is warned about. Maven's ordering, which Renovate follows,
        # puts X.Y.Z.N above X.Y.Z, so a head left on a released number after its tag publishes
        # builds that outrank the release and read as rebuilds of it. appframe, viddik, chronik and
        # zavarnik each kept publishing that way after a release until their heads were moved
        # (appframe#55, viddik#59, chronik#32, zavarnik#22).
        #
        # Asked of the remote, not of the checkout: actions/checkout fetches one commit and no tags.
        # `ls-remote` lists the refs without fetching anything, through the credentials checkout
        # left in the repository that holds the file — in check.yaml that is a fixture repository.
        # Only `v<head>`: no repository of the portfolio tags a release without the `v`, and the
        # numbered tags some of them push per run (`vX.Y.Z.N`) name a different ref.
        #
        # A WARNING, NOT A REFUSAL, until no caller's head is tagged. When this was written one still
        # was — oldge-ui's head stood at its released 0.1.0 — and a refusal would have turned its
        # next push red before anybody had moved it. A remote that cannot be asked is a warning too:
        # this step is not the place for a network error to stop a publish.
        tag="v${head}"
        tagged=""
        if refs="$(GIT_TERMINAL_PROMPT=0 git -C "$(dirname "$FILE")" ls-remote --tags --refs origin "refs/tags/${tag}" 2>&1)"; then
          if printf '%s\n' "$refs" | awk -v ref="refs/tags/${tag}" '$2 == ref { found = 1 } END { exit !found }'; then
            tagged="$tag"
            if [[ "$head" =~ ^([0-9]+\.[0-9]+\.)([0-9]+)$ ]]; then
              next="${BASH_REMATCH[1]}$((BASH_REMATCH[2] + 1))"
            else
              next="the next version"
            fi
            echo "::warning::${KEY}=${head} in ${FILE} is already tagged ${tag}: ${head}.${RUN} sorts" \
                 "above the release ${head} and reads as a rebuild of it. Move the head to ${next}" \
                 "first (kmp-library-release, step 5). This is a warning for now and will become a" \
                 "refusal."
          fi
        else
          echo "::warning::could not ask origin whether ${tag} exists, so a tagged head was not" \
               "checked: ${refs//$'\n'/ }"
        fi

        echo "version=${head}.${RUN}" >> "$GITHUB_OUTPUT"
        echo "tagged=${tagged}" >> "$GITHUB_OUTPUT"
        echo "version is ${head}.${RUN}"
