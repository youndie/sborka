# Temporary probe for #123: calls publish-wip.yaml at the feature branch's commit, which is not this
# one. `tasks: help` publishes nothing; what is under test is where the inner actions come from.
name: probe-caller
on:
  push:
    branches: [ probe/reusable-context-123 ]
jobs:
  wip:
    uses: youndie/sborka/.github/workflows/publish-wip.yaml@6f124292ab40f7a836b9adcee46cad9aa1edc0af
    with:
      tasks: help
      version-key: sborka.version
    secrets:
      REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
      REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
