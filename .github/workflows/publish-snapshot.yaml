name: Publish sborka snapshots

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-kotlin
        with:
          konan-cache: "true"

      - id: ver
        uses: ./.github/actions/determine-version
        with:
          # sborka's own head lives under its own key: `build-logic` is an included build and reads its
          # own directory's gradle.properties, so a bare `version` here would name the wrong file.
          key: sborka.version

      # Green before published. The order is the point: a publish is the one step that cannot be taken
      # back, and a consumer that has resolved a version keeps it.
      - name: Check
        run: ./gradlew check --no-daemon
        env:
          ORG_GRADLE_PROJECT_VERSION: ${{ steps.ver.outputs.version }}

      - name: Publish
        run: ./gradlew publishToWip --no-daemon
        env:
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
          ORG_GRADLE_PROJECT_VERSION: ${{ steps.ver.outputs.version }}

  # WHAT A CONSUMER RECEIVES, read from the repository after the upload rather than from a build
  # directory before it. A file that failed to upload and a coordinate that resolves to the previous
  # version do not exist until something asks the server, and neither fails a publish.
  consumer:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: What a consumer gets
        uses: youndie/proba@main
        with:
          # `catalog` is deliberately not here. A version catalog publishes `versionCatalogElements`
          # and nothing else — a platform for use during `version-catalog` — so proba's consumer build
          # asks it for a compile-time library and gets "no matching variant". That is proba working
          # correctly on a question that does not apply, and its answer is UNDETERMINED, which is a red
          # job saying nothing. The catalog is checked below instead, through the path that actually
          # reads it.
          #
          # `kapkan` is not here either, and for the same shape of reason as `catalog` — it took a
          # release to find out. A rule set jar is loaded by ktlint's worker through
          # `META-INF/services`; nobody compiles against it, and its ktlint dependencies are
          # `compileOnly` precisely so that it does not carry a second copy of the API onto that
          # worker. proba therefore reports its whole public API as unreachable, which is proba being
          # right about a question nobody is asking. What IS worth asking of it is below.
          coordinate: |
            ru.workinprogress.sborka:core:${{ needs.publish.outputs.version }}
            ru.workinprogress.sborka:conventions:${{ needs.publish.outputs.version }}
            ru.workinprogress.sborka:settings:${{ needs.publish.outputs.version }}
          repository: https://reposilite.kotlin.website/snapshots

  # THE CATALOG, RESOLVED FROM THE SERVER BY THE PLUGIN THAT NAMES IT.
  #
  # `check` already resolves it from a directory this build wrote, which proves the coordinate is
  # well-formed and nothing else. This resolves the PUBLISHED one over the network, through
  # `sborka.settings` — the only path anybody will use — and it can only run after the publish, which
  # is why it is a job of its own rather than a step in `check`.
  catalog:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-kotlin
        with:
          konan-cache: "true"

      - name: Resolve the published catalog
        run: |
          ./gradlew -p stand check --no-daemon \
            -Psborka.catalog=on \
            -Psborka.catalogVersion=${{ needs.publish.outputs.version }}

  # WHAT A RULE SET IS FOR, ASKED OF THE PUBLISHED JAR.
  #
  # `sborka.lint` names this coordinate on ktlint's `ktlintRuleset` configuration, and it is the one
  # artefact of the release that no plugin marker points at: a publish that lands the conventions and
  # not the rule set fails in a consumer's ktlint task, later and with a message about a missing
  # module. So the coordinate is fetched from the server rather than believed.
  #
  # AND THE SERVICE FILE INSIDE IT, which is the half that can go wrong quietly. ktlint finds a rule
  # set through `META-INF/services`; a jar that resolves and declares no provider makes every kapkan
  # rule stop running while every build stays green — the exact silence the rules exist to end.
  ruleset:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: What ktlint would load
        run: |
          set -euo pipefail
          version=${{ needs.publish.outputs.version }}
          url=https://reposilite.kotlin.website/snapshots/ru/workinprogress/sborka/kapkan/$version/kapkan-$version.jar
          curl --fail --silent --show-error --location "$url" --output kapkan.jar
          service=META-INF/services/com.pinterest.ktlint.cli.ruleset.core.api.RuleSetProviderV3
          unzip -p kapkan.jar "$service" > provider.txt
          provider=$(cat provider.txt)
          test -n "$provider"
          unzip -l kapkan.jar | grep -q "${provider//./\/}.class"
          echo "kapkan:$version declares $provider, and the class is in the jar"
