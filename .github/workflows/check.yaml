name: check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-kotlin
        with:
          # The stand has a linuxX64 target, so the Kotlin/Native toolchain is downloaded here.
          konan-cache: "true"

      # Compiles the conventions, runs their tests, and applies them in the stand: a separate build
      # that asks for the plugins by id.
      - name: Check
        run: ./gradlew check --no-daemon

      # WHAT A CONSUMER CAN NAME, ASKED BEFORE THE MERGE RATHER THAN AFTER IT.
      #
      # This check already existed and ran in the wrong place. `publish-snapshot.yaml` puts proba on
      # the published artefacts, which is the first moment there is something to resolve — and so the
      # first moment anybody learns that the public API hands out a type the consumer cannot name.
      # That is how `kotlin.Pair` reached `main` in #30: it compiled, the tests passed, this workflow
      # was green, ktlint had no opinion, and two publishes went red before a person read the log.
      #
      # There is no need to wait. `check` already publishes the conventions into
      # `build/local-repo-plugins` for `verifyBuildLogicPublications`, and proba reads a `file:`
      # repository off the disk. So the same question is asked here, on the pull request, against the
      # artefacts this run just built.
      #
      # `core` ONLY, AND THE OMISSIONS ARE DELIBERATE. `conventions` and `settings` come back
      # UNDETERMINED wherever proba runs them: their consumer build cannot resolve
      # `org.jlleitschuh.gradle:ktlint-gradle`, which lives on the plugin portal. `kapkan` is a rule
      # set loaded by ktlint through `META-INF/services` with its ktlint dependencies `compileOnly`,
      # so proba reports its whole API as unreachable — correctly, about a question nobody is asking.
      # `core` is the plain library of the four, and it is the one that broke.
      - name: The version this build published locally
        id: published
        run: |
          set -euo pipefail
          version="$(grep -E '^sborka\.version=' gradle.properties | head -1 | cut -d= -f2- | tr -d '[:space:]')"
          test -d "build/local-repo-plugins/io/github/youndie/sborka/core/$version" ||
            { echo "::error::nothing published at $version — did the check step change?"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: What a consumer can name
        uses: youndie/proba@main
        with:
          coordinate: io.github.youndie.sborka:core:${{ steps.published.outputs.version }}
          repository: file://${{ github.workspace }}/build/local-repo-plugins

      # THE REPORT TASKS, RUN ONCE SO THAT THEY ARE RUN AT ALL.
      #
      # Neither is in `check` by design — both write a list for a person — and a task nobody ever
      # invokes is a task whose registration nobody has tested. This does not read the lists: it
      # proves they are registered on a real consumer build, that they wait for the compilations
      # they read, and that the guard against reading zero class files does not fire on a build
      # that has some.
      - name: The reports register and run on a consumer build
        run: ./gradlew -p stand kapkanJoins kapkanMethodSizes --no-daemon

      # THE ONE THING `check` CANNOT COVER, and it needs its own ordering to cover it.
      #
      # `sborka.settings` wires in the published version catalog by coordinate, and a settings plugin
      # resolves its catalog before any task in the same invocation has run — so the build that
      # publishes the catalog cannot be the build that reads it. Two invocations: publish it into a
      # directory, then run the stand again against that directory with the catalog switched on.
      #
      # Without this the coordinate in `sborka.settings` is a string nothing ever resolves, and it
      # would be wrong for exactly as long as it took somebody to migrate a repository.
      - name: Publish the catalog to a directory
        run: ./gradlew :catalog:publishAllPublicationsToLocalRepository --no-daemon

      - name: Resolve the catalog the way a repository will
        run: |
          ./gradlew -p stand check --no-daemon \
            -Psborka.catalog=on \
            -Psborka.catalogRepository="file://$PWD/build/local-repo"
