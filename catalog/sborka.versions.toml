# What more than one repository has to agree on, and nothing else.
#
# The test for admission is not "several repositories use it" but "it going out of step between them
# is a defect". Kotlin qualifies: a library published from one repository and consumed by another
# carries metadata a mismatched compiler refuses. A logging backend does not — two services on two
# versions of it is two services, not a bug.
#
# Reached in a build as the `wip` catalog, beside the repository's own `libs`:
#
#     implementation(wip.kotlinx.coroutines.core)
#
# What already agreed on its own is here to KEEP agreeing: kotlin and coroutines are identical in all
# eighteen catalogs today, by discipline. What had drifted when this file was written is marked.

[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"

# Drifted: 3.5.2 in seven repositories, 3.4.0 in one.
ktor = "3.5.2"

# Drifted: 2.3.11 in five, 2.3.10 in two. KSP is versioned against the compiler, so the pair moves
# together — a repository on a different KSP than its Kotlin fails at annotation processing with a
# message about an internal API.
ksp = "2.3.12"

# Drifted: 9.3.0 / 9.3.1 / 9.3.2 across three repositories when this file was written, and 9.4.0
# in katcher by the time the portfolio started reading the version from here. That is the direction
# the drift goes on its own: the repository that takes a bump first ends up AHEAD of the shared
# file, and a catalog that stays behind hands it a downgrade the first time it reads from here.
agp = "9.4.0"

# Drifted: 1.11.1 in three, 1.12.0 in two.
composeMultiplatform = "1.12.0"

# NO ktlint HERE, AND THAT IS THE FIX. The portfolio spelled two different things as one catalog key
# called `ktlint` — the TOOL in nine repositories, the PLUGIN in four — which is why the same key reads
# 1.8.0 in some and 14.2.0 in others. `sborka.lint` applies the plugin and pins the tool, so a
# repository names neither, and the key that could be misread no longer exists.

# Drifted: 6.1.3 in one repository, 4.13.2 in another — which is JUnit 4 beside JUnit 6, not a bump.
junit = "6.1.3"

koin = "4.2.2"
okio = "3.18.2"
turbine = "1.2.1"
atomicfu = "0.33.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-test = { module = "io.insert-koin:koin-test" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

# Versioned BY the compiler, not beside it. `kotlin-test` has to be the version that compiled the
# code under test, and a build plugin compiled against one Kotlin and run by another fails inside
# the Gradle plugin classpath — so neither of these is a number a repository gets to pick, which is
# exactly the admission test at the top of this file.
#
# They are here because five repositories were already holding them on their own `kotlin` key:
# telek, razves and s3kn the gradle plugin, shildik and petich kotlin-test. That key is what the
# `wip` catalog took over, and without these two entries those five would have had to keep it —
# one number, kept in step by hand, which is the defect this file exists to remove.
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# Versioned by Compose Multiplatform, and held on that key by two repositories already — appframe
# and viddik, both spelling the same coordinate against their own `compose-multiplatform`. The
# admission test is the one at the top of the file: the preview artefact and the Compose plugin
# going out of step is a defect, not a preference.
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }

# The four Compose artefacts more than one repository names by coordinate. They are here rather than
# taken through the plugin's `compose.*` accessors deliberately, and konekt wrote down why: 1.11.1
# deprecates those accessors in favour of naming the dependency directly, and an accessor carries a
# version of its own that the build file does not show — which is the shape of the failure it hit,
# a newer foundation against an older material3, `AbstractMethodError` inside a renderer at RUNTIME
# with nothing failing to resolve or compile.
#
# material3 is NOT here and must not be: it has no stable release in either train, moves on its own
# line in every repository that carries it, and tying it to this ref would ask for a version that
# was never published.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version.ref = "atomicfu" }

# The rest of the compiler's own plugin set, and the two Android ones beside the library plugin
# that was already here. Each was found by a repository that could not take its compiler from this
# catalog without keeping a local version for exactly one line:
#   allopen  — bochka and booblik
#   android  — viddik (`org.jetbrains.kotlin.android`, versioned by the compiler like the rest)
#   the AGP application/library pair — konekt, kvadrant-ui and viddik, which spells the same
#   version under a third name (`androidGradlePlugin`) and is the drift this fixes
kotlinAllOpen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
